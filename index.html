<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDIO KARAT — Buchhaltung</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface2:#f2f2f7;
  --divide:rgba(60,60,67,.12); --divide-strong:rgba(60,60,67,.2);
  --text:#1c1c1e; --text-secondary:#6e6e73; --text-tertiary:#aeaeb2;
  --blue:#007aff; --blue-bg:rgba(0,122,255,.09);
  --green:#2f9e52; --green-bg:rgba(47,158,82,.1);
  --red:#ff3b30; --red-bg:rgba(255,59,48,.08);
  --orange:#c46a00; --orange-bg:rgba(255,149,0,.13);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --field-h:40px;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh;}
.mono{font-family:'DM Mono',monospace;}
.page{max-width:1180px; margin:0 auto; padding:28px 20px 72px;}

header.top{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.wordmark{display:flex; align-items:center; gap:12px;}
.wordmark-icon{width:34px; height:34px; background:var(--blue); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.wordmark-icon svg{width:18px; height:18px;}
h1{font-size:19px; font-weight:700; margin:0; letter-spacing:-.02em;}
.kicker{font-size:12px; font-weight:600; color:var(--blue); text-transform:uppercase; letter-spacing:.06em; margin-top:1px;}
.account-pill{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-secondary); background:var(--surface); border-radius:999px; padding:6px 6px 6px 12px; box-shadow:var(--shadow); flex-wrap:wrap;}
.account-pill img{width:22px; height:22px; border-radius:50%;}
.account-pill select{height:30px; font-size:12.5px; padding:0 28px 0 10px; border-radius:999px;}

.navrow{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:20px;}
nav.tabs{display:flex; gap:4px; background:#e5e5ea; border-radius:999px; padding:4px; flex-wrap:wrap; width:fit-content; max-width:100%;}
nav.tabs button{font-family:'DM Sans',sans-serif; font-weight:500; font-size:13px; background:transparent; border:none;
  padding:9px 15px; cursor:pointer; border-radius:999px; color:var(--text-secondary); transition:all .15s var(--ease); white-space:nowrap;}
nav.tabs button:hover{color:var(--text);}
nav.tabs button.active{background:var(--blue); color:#fff; font-weight:600; box-shadow:0 2px 6px rgba(0,122,255,.35);}
.yearpick{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-secondary); font-weight:500;}
.yearpick select{height:34px; border-radius:999px; background-color:var(--surface); font-weight:600;}

.card{background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--shadow); padding:24px; margin-bottom:18px;}
.card h2{font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--text-secondary); margin:0 0 16px;}
.card h3{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-secondary); margin:22px 0 10px;}
.card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
.card-head h2{margin-bottom:12px;}

.grid{display:grid; gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:860px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:720px){.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.kpi{background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:18px 20px;}
.card .kpi{background:var(--surface2); box-shadow:none;}
.kpi .label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-secondary);}
.kpi .value{font-variant-numeric:tabular-nums; font-size:23px; font-weight:600; margin-top:6px; color:var(--text);}
.kpi .sub{font-size:12px; color:var(--text-secondary); margin-top:2px;}
.kpi .value.pos{color:var(--green);} .kpi .value.neg{color:var(--red);}
.kpi.clickable{cursor:pointer;} .kpi.clickable:hover{outline:2px solid var(--blue-bg);}

.tablewrap{overflow-x:auto; margin:0 -4px; padding:0 4px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-secondary); border-bottom:1px solid var(--divide-strong); padding:9px 10px; white-space:nowrap;}
td{padding:10px 10px; border-bottom:1px solid var(--divide); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.total td{font-weight:600; border-top:1px solid var(--divide-strong); border-bottom:none;}
tr.sub td{color:var(--text-secondary); font-style:italic;}
tr.storno td{opacity:.45;} tr.storno td.desc{text-decoration:line-through;}
tr.editing td{background:var(--blue-bg);}
th.num{text-align:right;}
.num{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
.num.pos{color:var(--green);} .num.neg{color:var(--red);}
td.nr{font-family:'DM Mono',monospace; font-size:12.5px; color:var(--text-secondary); white-space:nowrap;}
td.date{white-space:nowrap;}
td.desc .small{display:block; font-size:12px; color:var(--text-secondary);}

.badge{display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:500; white-space:nowrap;}
.badge.settled{background:var(--green-bg); color:var(--green);}
.badge.person{background:var(--blue-bg); color:var(--blue);}
.badge.warn{background:var(--orange-bg); color:var(--orange);}
.badge.grey{background:var(--surface2); color:var(--text-secondary);}
.badge.red{background:var(--red-bg); color:var(--red);}

.row-form{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-top:14px;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-top:14px; align-items:end;}
.form-grid .span2{grid-column:span 2;}
@media(max-width:520px){.form-grid .span2{grid-column:auto;}}
.field{display:flex; flex-direction:column; gap:6px; min-width:0;}
.field label{font-size:11.5px; font-weight:500; color:var(--text-secondary);}
input,select{
  height:var(--field-h); box-sizing:border-box; width:100%;
  font-family:'DM Sans',sans-serif; font-size:13.5px; padding:0 12px;
  border:1px solid var(--divide-strong); border-radius:var(--r-md);
  background:var(--surface2); color:var(--text); outline:none;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.row-form input, .row-form select{width:auto;}
select{
  appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%236e6e73' stroke-width='1.6'%3E%3Cpath d='M6 8l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 10px center; background-size:14px; padding-right:32px;
}
input:focus, select:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg); background-color:#fff;}
input.amount{font-variant-numeric:tabular-nums; text-align:right;}
input[type=file]{height:auto; padding:8px;}
input[type=checkbox]{height:auto; width:16px; accent-color:var(--blue); cursor:pointer;}
.check{display:flex; gap:7px; align-items:center; font-size:13px; color:var(--text-secondary); cursor:pointer; white-space:nowrap;}

.seg{display:inline-flex; background:var(--surface2); border-radius:var(--r-md); padding:3px; gap:2px; flex-wrap:wrap;}
.seg button{font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; border:none; background:transparent; padding:8px 14px; border-radius:9px; cursor:pointer; color:var(--text-secondary);}
.seg button.active{background:var(--surface); color:var(--text); font-weight:600; box-shadow:var(--shadow);}

button.btn{
  font-family:'DM Sans',sans-serif; font-weight:600; font-size:13px; height:var(--field-h);
  background:var(--blue); color:#fff; border:none; border-radius:var(--r-md); padding:0 18px; cursor:pointer;
  transition:opacity .15s; white-space:nowrap;
}
button.btn:hover{opacity:.88;}
button.btn.ghost{background:var(--surface2); color:var(--text);}
button.btn.danger{background:var(--red); color:#fff;}
button.btn.danger.small{background:transparent; color:var(--red);}
button.btn.small{height:auto; padding:6px 11px; font-size:12px;}
button.btn:disabled{opacity:.5; cursor:not-allowed;}
.actions{white-space:nowrap; text-align:right;}

.proj-list{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.proj-chip{border:1px solid var(--divide-strong); border-radius:999px; padding:8px 16px; cursor:pointer; background:var(--surface);
  font-size:13px; font-weight:500; transition:all .15s var(--ease);}
.proj-chip.active{background:var(--blue); color:#fff; border-color:var(--blue);}

.hint{font-size:12px; color:var(--text-secondary); margin-top:10px; line-height:1.6;}
.note{background:var(--orange-bg); color:#7a4300; border-radius:var(--r-md); padding:12px 14px; font-size:13px; line-height:1.55; margin-bottom:14px;}
.note.blue{background:var(--blue-bg); color:#004a99;}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff;
  padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; box-shadow:var(--shadow); z-index:2000; max-width:90vw; text-align:center;}
.toast.show{opacity:1;}
.empty{color:var(--text-tertiary); font-size:13px; padding:16px 0; font-style:italic;}
.member-edit{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.loading{padding:60px 0; text-align:center; color:var(--text-tertiary); font-size:14px;}
a.link{color:var(--blue); text-decoration:none;} a.link:hover{text-decoration:underline;}

.setup-card{max-width:520px; margin:60px auto; background:var(--surface); border-radius:var(--r-xl); box-shadow:var(--shadow); padding:28px;}
.setup-card h2{margin:0 0 6px; font-size:17px; font-weight:700; text-transform:none; letter-spacing:0; color:var(--text);}
.setup-card p{font-size:13px; color:var(--text-secondary); line-height:1.6; margin:0 0 18px;}
.setup-card .field{margin-bottom:14px;}
.gsi-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:44px; background:#fff; border:1px solid var(--divide-strong); border-radius:var(--r-md); cursor:pointer; font-family:'DM Sans',sans-serif; font-weight:500; font-size:14px; color:var(--text);}
.gsi-btn:hover{background:var(--surface2);}

.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:1500; display:flex; align-items:center; justify-content:center; padding:16px;}
.modal{background:var(--surface); border-radius:var(--r-xl); padding:24px; width:100%; max-width:440px; box-shadow:0 10px 40px rgba(0,0,0,.2);}
.modal h2{font-size:16px; margin:0 0 8px;}
.modal p{font-size:13px; color:var(--text-secondary); margin:0 0 14px; line-height:1.55;}

/* Bericht */
.report h1{font-size:22px; margin-bottom:4px;}
.report .meta{font-size:13px; color:var(--text-secondary); margin-bottom:6px;}
.report table{font-size:12.5px;}
.report td{padding:7px 8px;} .report th{padding:7px 8px;}
.print-only{display:none;}
@media print{
  @page{size:A4; margin:14mm 12mm;}
  body{background:#fff; font-size:11px;}
  .page{max-width:none; padding:0;}
  header.top, .navrow, .no-print, .toast, #busy-overlay, #hang-banner{display:none !important;}
  .card{box-shadow:none; padding:0; margin:0 0 18px; border-radius:0;}
  .print-only{display:block;}
  .report section{break-inside:avoid-page;}
  .report section.long{break-inside:auto;}
  .report table{font-size:10px;}
  .tablewrap{overflow:visible;}
  tr{break-inside:avoid;}
  a{color:inherit; text-decoration:none;}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="loading">Lade…</div>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>
<div id="busy-overlay" style="display:none; position:fixed; inset:0; background:rgba(242,242,247,.65); backdrop-filter:blur(2px); z-index:1000; align-items:center; justify-content:center; flex-direction:column; gap:12px;">
  <div style="width:28px; height:28px; border:3px solid var(--divide-strong); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite;"></div>
  <div style="font-size:13px; color:var(--text-secondary); font-weight:500;" id="busy-label">Speichert…</div>
</div>
<div id="hang-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:1001; background:var(--red); color:#fff; padding:12px 20px; align-items:center; justify-content:center; gap:14px; font-size:13.5px; font-weight:500;">
  <span>Die Verbindung zu Google Sheets hängt gerade. Bitte neu laden.</span>
  <button class="btn" style="background:#fff; color:var(--red); height:30px; padding:0 14px;" onclick="location.reload()">Neu laden</button>
</div>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>

<script>
// ============ KONFIGURATION (wird einmalig lokal gespeichert) ============
let CONFIG = (()=>{ try { return JSON.parse(localStorage.getItem('karat_config') || 'null'); } catch(e){ return null; } })();

// ============ Sheet-Struktur ============
// Spalten werden über die Kopfzeile zugeordnet, nicht über die Position.
// Fehlende Spalten hängt die App hinten an, vorhandene Daten bleiben unberührt.
const SHEET_DEFS = {
  Journal:    ['id','belegnr','datum','typ','betrag','konto','zielKonto','kategorie','projektId','beschreibung','bezahltVon','erstattetDurch','bezugId','belegUrl','storniert','stornoGrund','pruefen','hinweis','erfasstAm','erfasstVon','geaendertAm','geaendertVon'],
  Projekte:   ['id','name','kuerzel','traeger','budget','einnahmenBar','einnahmenShop'],
  Konten:     ['konto','anfang','tatsaechlich','anfangDatum','tatsaechlichDatum'],
  Mitglieder: ['name'],
  Stammdaten: ['schluessel','wert'],
  Protokoll:  ['zeit','nutzer','aktion','id','vorher','nachher'],
};
// Alte Tabs (bis Okt. 2026). Werden nur noch gelesen – für die einmalige Übernahme ins Journal.
const LEGACY_SHEETS = ['Buchungen','Vereinskonto'];

const ACCOUNTS = ["Vereinskonto","PayPal","Barkasse"];
const ACCOUNT_LABELS = { Vereinskonto:"Bankkonto", PayPal:"PayPal", Barkasse:"Barkasse", Privat:"privat" };
function accLabel(a){ return ACCOUNT_LABELS[a] || a || '—'; }
const DEFAULT_MEMBERS = ["Mitglied 1","Mitglied 2","Mitglied 3","Mitglied 4","Mitglied 5","Mitglied 6","Mitglied 7","Mitglied 8","Mitglied 9","Mitglied 10"];
const DEFAULT_STAMM = [
  ['name','STUDIO KARAT GbR'],
  ['anschrift','Degenfeldstraße 13–15, 76131 Karlsruhe'],
  ['steuernummer',''],
  ['gesellschafter','Bauer, Hildenbrand, Lajos, Schwanninger, Schilbach'],
  ['umsatzsteuer',''],
];

// ---------- Kategorien (EÜR) ----------
const KAT_EINNAHME = ['Eintritte & Tickets','Verkäufe (Kunst, Shop, Getränke)','Honorare & Aufträge','Fördermittel & Zuschüsse','Mietanteile & Raumnutzung','Spenden','Sonstige Einnahmen'];
const KAT_AUSGABE  = ['Miete & Nebenkosten','Material & Verbrauch','Getränke & Catering (Wareneinkauf)','Honorare & Fremdleistungen','Leihe & Miete Equipment','Technik & Geräte (bis 800 € netto)','Anschaffung über 800 € netto (AfA)','Werbung & Druck','Reise & Transport','Gebühren, Versicherung & Beiträge','Büro, Software & Telefon','Bewirtung (70 % abziehbar)','Geschenke (bis 50 €)','Sonstige Ausgaben'];
// Bewegungen, die Geld verschieben, aber kein Gewinn/Verlust sind:
const KAT_NEUTRAL_EIN = ['Einlage Gesellschafter','Durchlaufender Posten'];
const KAT_NEUTRAL_AUS = ['Entnahme Gesellschafter','Durchlaufender Posten'];
const NEUTRAL = ['Einlage Gesellschafter','Entnahme Gesellschafter','Durchlaufender Posten','Erstattung Auslage','Umbuchung'];

// ============ Auth (unverändert) ============
let accessToken = null;
let tokenClient = null;
let userInfo = null;

function initGis(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.clientId,
    scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
    callback: async (resp) => {
      if(resp.error){ showToast('Anmeldung fehlgeschlagen: '+resp.error); return; }
      accessToken = resp.access_token;
      try { userInfo = await apiFetch('https://www.googleapis.com/oauth2/v2/userinfo'); } catch(e){ userInfo = null; }
      await boot();
    },
  });
}
function signIn(promptConsent){
  tokenClient.requestAccessToken({ prompt: promptConsent ? 'consent' : '' });
}
function signOut(){
  if(accessToken) google.accounts.oauth2.revoke(accessToken, ()=>{});
  accessToken = null; userInfo = null;
  renderSetupOrSignIn();
}
function me(){ return (userInfo && userInfo.email) || ''; }

// ============ Low-level Sheets API ============
const API_BASE = 'https://sheets.googleapis.com/v4/spreadsheets';
let sheetIdCache = {};
let sheetHeaders = {};

async function apiFetch(url, method, body){
  const res = await fetch(url, {
    method: method || 'GET',
    headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if(res.status === 401){
    await new Promise(resolve=>{
      tokenClient.callback = async (resp)=>{ accessToken = resp.access_token; resolve(); };
      tokenClient.requestAccessToken({ prompt:'' });
    });
    return apiFetch(url, method, body);
  }
  const json = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error((json.error && json.error.message) || ('Sheets API Fehler ('+res.status+')'));
  return json;
}

function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,12); }
function rng(r){ return encodeURIComponent(r); }
// WICHTIG: Werte immer UNFORMATIERT lesen. Formatiert liefert ein deutsches Sheet „12,50" bzw. „1.234,56",
// und parseFloat macht daraus 12 bzw. 1,234 – das war der Cent-Fehler.
const READ_OPTS = 'valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER';

async function getSheetMeta(){
  const meta = await apiFetch(`${API_BASE}/${CONFIG.spreadsheetId}?fields=sheets.properties`);
  sheetIdCache = {};
  meta.sheets.forEach(s=>{ sheetIdCache[s.properties.title] = s.properties.sheetId; });
  return meta.sheets.map(s=>s.properties.title);
}

async function ensureSheets(){
  const existing = await getSheetMeta();
  const toInit = Object.keys(SHEET_DEFS).filter(n=>!existing.includes(n));
  if(toInit.length){
    await apiFetch(`${API_BASE}/${CONFIG.spreadsheetId}:batchUpdate`, 'POST', { requests: toInit.map(title=>({ addSheet:{ properties:{ title } } })) });
    await getSheetMeta();
  }
  for(const name of toInit){
    const rows = [SHEET_DEFS[name]];
    if(name==='Konten') ACCOUNTS.forEach(a=>rows.push([a,0,0,'','']));
    if(name==='Mitglieder') DEFAULT_MEMBERS.forEach(m=>rows.push([m]));
    if(name==='Stammdaten') DEFAULT_STAMM.forEach(r=>rows.push(r));
    await apiFetch(`${API_BASE}/${CONFIG.spreadsheetId}/values/${rng(name+'!A1')}?valueInputOption=RAW`, 'PUT', { values: rows });
  }
  // Fehlende Spalten hinten anhängen
  for(const name of Object.keys(SHEET_DEFS)){
    if(toInit.includes(name)) { sheetHeaders[name] = SHEET_DEFS[name].slice(); continue; }
    const headerJson = await apiFetch(`${API_BASE}/${CONFIG.spreadsheetId}/values/${rng(name+'!1:1')}?${READ_OPTS}`);
    const current = ((headerJson.values && headerJson.values[0]) || []).map(h=>String(h).trim());
    const missing = SHEET_DEFS[name].filter(h => current.indexOf(h) === -1);
    if(missing.length){
      await apiFetch(`${API_BASE}/${CONFIG.spreadsheetId}/values/${rng(name+'!'+colLetter(current.length+1)+'1')}?valueInputOption=RAW`, 'PUT', { values:[missing] });
    }
    sheetHeaders[name] = current.concat(missing);
  }
}

async function readSheet(name){
  const json = await apiFetch(`${API_BASE}/${CONFIG.spreadsheetId}/values/${rng(name+'!A1:AZ')}?${READ_OPTS}`);
  const values = json.values || [];
  const headers = (values[0] || []).map(h=>String(h).trim());
  sheetHeaders[name] = headers;
  return values.slice(1).map((r,i)=>{
    const o = { __row: i+2 };
    headers.forEach((h,idx)=>{ if(h) o[h] = (r[idx] !== undefined && r[idx] !== null) ? r[idx] : ''; });
    return o;
  }).filter(o => headers.some(h => h && o[h] !== ''));
}

function toRow(name, obj){
  const headers = sheetHeaders[name] || SHEET_DEFS[name];
  return headers.map(h => {
    const v = obj[h];
    if(v === undefined || v === null) return '';
    return v;
  });

// Zeilen über ihre ID finden (nicht über gemerkte Zeilennummern) – sicher, wenn mehrere gleichzeitig arbeiten.
async function updateRows(name, objs, idField){
  if(!objs.length) return;
  idField = idField || 'id';
  const headers = sheetHeaders[name];
  const idIdx = headers.indexOf(idField);
  if(idIdx < 0) throw new Error(`Spalte ${idField} fehlt in ${name}`);
  const col = colLetter(idIdx+1);
  const colJson = await apiFetch(`${API_BASE}/${CONFIG.spreadsheetId}/values/${rng(name+'!'+col+':'+col)}?${READ_OPTS}`);
  const ids = (colJson.values || []).map(r => r[0] !== undefined ? String(r[0]) : '');
  const last = colLetter(headers.length);
  const data = objs.map(o=>{
    const idx = ids.indexOf(String(o[idField]));
    if(idx < 1) throw new Error(`Eintrag ${o[idField]} nicht mehr im Sheet gefunden – bitte neu laden.`);
    const r = idx+1;
    return { range: `${name}!A${r}:${last}${r}`, values:[toRow(name,o)] };
  });
  await apiFetch(`${API_BASE}/${CONFIG.spreadsheetId}/values:batchUpdate`, 'POST', { valueInputOption:'RAW', data });
}

// ============ Google Drive: Belege ablegen ============
const DRIVE_FILES_API = 'https://www.googleapis.com/drive/v3/files';
const DRIVE_UPLOAD_API = 'https://www.googleapis.com/upload/drive/v3/files';
let folderCache = {};

async function findOrCreateFolder(name, parentId){
  const cacheKey = parentId + '/' + name;
  if(folderCache[cacheKey]) return folderCache[cacheKey];
  const safeName = name.replace(/'/g, "\\'");
  const q = encodeURIComponent(`'${parentId}' in parents and name='${safeName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const list = await apiFetch(`${DRIVE_FILES_API}?q=${q}&fields=files(id,name)`);
  if(list.files && list.files.length){ folderCache[cacheKey] = list.files[0].id; return list.files[0].id; }
  const created = await apiFetch(DRIVE_FILES_API, 'POST', { name, mimeType:'application/vnd.google-apps.folder', parents:[parentId] });
  folderCache[cacheKey] = created.id;
  return created.id;
}
async function resolveBelegFolder(typ, datumStr){
  if(!CONFIG.financeFolderId) throw new Error('Kein Finanzen-Ordner eingestellt (Einstellungen).');
  const year = /^\d{4}/.test(datumStr||'') ? datumStr.slice(0,4) : String(new Date().getFullYear());
  const alleRechnungen = await findOrCreateFolder('Alle Rechnungen', CONFIG.financeFolderId);
  const yearFolder = await findOrCreateFolder(year, alleRechnungen);
  const subName = typ === 'Einnahme' ? 'Einnahmen' : (typ === 'Umbuchung' ? 'Umbuchungen' : 'Ausgaben');
  return await findOrCreateFolder(subName, yearFolder);
}
function sanitizeFilenamePart(s){
  return (s || '').toString().normalize('NFKD').replace(/[^\w\- ]/g,'').trim().replace(/\s+/g,'_').slice(0,40) || 'Beleg';
}
function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for(let i=0; i<bytes.length; i+=chunkSize){ binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize)); }
  return btoa(binary);
}
async function uploadBeleg(file, folderId, filename){
  const metadata = { name: filename, parents:[folderId] };
  const boundary = '-------karat' + uid();
  const delim = `\r\n--${boundary}\r\n`;
  const closeDelim = `\r\n--${boundary}--`;
  const base64Data = arrayBufferToBase64(await file.arrayBuffer());
  const body =
    delim + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) +
    delim + `Content-Type: ${file.type || 'application/octet-stream'}\r\nContent-Transfer-Encoding: base64\r\n\r\n` + base64Data +
    closeDelim;
  const res = await fetch(`${DRIVE_UPLOAD_API}?uploadType=multipart&fields=id,webViewLink`, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body,
  });
  const json = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error((json.error && json.error.message) || 'Drive-Upload fehlgeschlagen');
  return json;
}
async function storeBeleg(file, row, kuerzel){
  const folderId = await resolveBelegFolder(row.typ, row.datum);
  const ext = (file.name.split('.').pop() || 'pdf').toLowerCase();
  const filename = `${row.datum}_${row.belegnr}_${kuerzel||'ALLG'}_${sanitizeFilenamePart(row.beschreibung)}.${ext}`;
  const up = await uploadBeleg(file, folderId, filename);
  return up.webViewLink || (up.id ? `https://drive.google.com/file/d/${up.id}/view` : '');
}

// ============ Hilfsfunktionen ============
function round2(n){ return Math.round((+n||0)*100)/100; }
// Liest „12,50", „12.50", „1.234,56", „1234.56", „12,50 €" korrekt.
function parseAmount(v){
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v ?? '').trim().replace(/[€\s ]/g,'');
  if(!s) return 0;
  let neg = false;
  if(/^-/.test(s)){ neg = true; s = s.slice(1); }
  const lastComma = s.lastIndexOf(','), lastDot = s.lastIndexOf('.');
  if(lastComma > -1 && lastDot > -1){
    if(lastComma > lastDot) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(lastComma > -1){
    s = s.replace(/\./g,'').replace(/,/g, (m, i)=> i===lastComma ? '.' : '');
  } else if(lastDot > -1 && /^\d{1,3}(\.\d{3})+$/.test(s)){
    s = s.replace(/\./g,''); // „1.500" = 1500
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
}
const num = parseAmount;
function eur(n){ return (+n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'}); }
function amountInput(n){ return (n===''||n===undefined||n===null) ? '' : (+n).toLocaleString('de-DE',{minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:false}); }
function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const escAttr = esc;
function truthy(v){ return v===true || v===1 || ['true','TRUE','WAHR','wahr','1','ja'].includes(String(v)); }
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowStamp(){ const d=new Date(); return `${today()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
// Datum robust normalisieren: ISO-Text, Sheets-Seriennummer oder „09.10.2026" → „2026-10-09"
function toISO(v){
  if(v === '' || v === null || v === undefined) return '';
  if(typeof v === 'number'){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v*86400000));
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if(m){ const y = m[3].length===2 ? '20'+m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  if(/^\d+(\.\d+)?$/.test(s)) return toISO(parseFloat(s));
  return s;
}
function deDate(iso){ const m = (iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}.${m[2]}.${m[1]}` : (iso||''); }
function nextDay(iso){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function val(id){ const el=document.getElementById(id); return el ? el.value : ''; }

function showToast(msg, ms){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');

function kontoRow(a){ return state.konten.find(k=>k.konto===a) || { konto:a, anfang:0, tatsaechlich:0, anfangDatum:'', tatsaechlichDatum:'' }; }
function byId(id){ return state.journal.find(r=>r.id===id); }

// ============ Buchhaltungslogik ============
function active(){ return state.journal.filter(r=>!r.storniert); }
function inYear(r, y){ y = y || ui.year; return y==='alle' || (r.datum||'').slice(0,4) === y; }
function isEuer(r){ return r.typ!=='Umbuchung' && !NEUTRAL.includes(r.kategorie); }
function isAuslage(r){ return r.konto==='Privat' && r.typ==='Ausgabe'; }
function isErstattung(r){ return r.kategorie==='Erstattung Auslage'; }
// Wirkung einer Buchung auf ein Konto (+ Zugang / − Abgang)
function effect(r, k){
  if(r.typ==='Einnahme' && r.konto===k) return r.betrag;
  if(r.typ==='Ausgabe' && r.konto===k) return -r.betrag;
  if(r.typ==='Umbuchung'){ let e=0; if(r.konto===k) e-=r.betrag; if(r.zielKonto===k) e+=r.betrag; return e; }
  return 0;
}
function counts(r, k){ const kr = kontoRow(k); return !kr.anfangDatum || !r.datum || r.datum >= kr.anfangDatum; }
// Kontostand vor einem Datum (exklusiv). before = null → alles.
function balanceAt(k, before){
  const kr = kontoRow(k);
  let b = kr.anfang;
  active().forEach(r=>{ if(counts(r,k) && (!before || (r.datum||'') < before)) b += effect(r,k); });
  return round2(b);
}
function yearBounds(y){ y = y || ui.year; return y==='alle' ? [null,null] : [`${y}-01-01`, `${+y+1}-01-01`]; }
function kontoJahr(k, y){
  const [from, to] = yearBounds(y);
  const kr = kontoRow(k);
  const start = from ? balanceAt(k, from) : kr.anfang;
  let zu=0, ab=0;
  active().forEach(r=>{
    if(!counts(r,k)) return;
    if(from && !((r.datum||'') >= from && (r.datum||'') < to)) return;
    const e = effect(r,k); if(e>0) zu+=e; else ab-=e;
  });
  return { start: round2(start), zu: round2(zu), ab: round2(ab), ende: round2(start+zu-ab) };
}
function euer(y){
  const rows = active().filter(r=>inYear(r,y) && isEuer(r));
  const ein = {}, aus = {};
  rows.forEach(r=>{ const t = r.typ==='Einnahme' ? ein : aus; const k = r.kategorie || 'ohne Kategorie'; t[k] = round2((t[k]||0) + r.betrag); });
  const sumE = round2(Object.values(ein).reduce((s,v)=>s+v,0)), sumA = round2(Object.values(aus).reduce((s,v)=>s+v,0));
  return { ein, aus, sumE, sumA, ergebnis: round2(sumE-sumA) };
}
function neutralSummary(y){
  const out = {};
  active().filter(r=>inYear(r,y) && !isEuer(r)).forEach(r=>{
    const k = r.typ==='Umbuchung' ? `Umbuchung ${accLabel(r.konto)} → ${accLabel(r.zielKonto)}` : r.kategorie;
    out[k] = round2((out[k]||0) + r.betrag);
  });
  return out;
}
function auslageOffen(a){ if(!a.erstattetDurch) return true; const e = byId(a.erstattetDurch); return !e || e.storniert; }
function memberTotals(m, bis){
  const al = active().filter(r=>isAuslage(r) && r.bezahltVon===m && (!bis || r.datum < bis));
  const gesamt = round2(al.reduce((s,r)=>s+r.betrag,0));
  const offenList = al.filter(a=>{
    if(!bis) return auslageOffen(a);
    const e = a.erstattetDurch ? byId(a.erstattetDurch) : null;
    return !e || e.storniert || e.datum >= bis;
  });
  const offen = round2(offenList.reduce((s,r)=>s+r.betrag,0));
  return { gesamt, offen, erstattet: round2(gesamt-offen), offenList };
}
function allMembersWithAuslagen(){
  const set = new Set(state.members);
  state.journal.forEach(r=>{ if(isAuslage(r) && r.bezahltVon) set.add(r.bezahltVon); });
  return [...set];
}
function projektSummen(pid, y){
  const rows = active().filter(r=>r.projektId===pid && isEuer(r) && (!y || inYear(r,y)));
  const e = round2(rows.filter(r=>r.typ==='Einnahme').reduce((s,r)=>s+r.betrag,0));
  const a = round2(rows.filter(r=>r.typ==='Ausgabe').reduce((s,r)=>s+r.betrag,0));
  return { e, a, d: round2(e-a), n: rows.length };
}
function nextBelegnummer(){
  const nums = state.journal.map(r=>parseInt(r.belegnr,10)).filter(n=>!isNaN(n));
  return String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4,'0');
}
function years(){
  const set = new Set([String(new Date().getFullYear())]);
  state.journal.forEach(r=>{ if(/^\d{4}/.test(r.datum)) set.add(r.datum.slice(0,4)); });
  return [...set].sort().reverse();
}
function needsBeleg(r){ return !r.storniert && isEuer(r) && !r.belegUrl; }
function artOf(r){
  if(r.typ==='Umbuchung') return 'Umbuchung';
  if(isErstattung(r)) return 'Erstattung';
  if(isAuslage(r)) return 'Auslage';
  return r.typ;
}

const BF_HINTS = {
  Einnahme: 'Geld kommt auf ein Konto der GbR. Fördergelder, Eintritte, Verkäufe, Mietanteile.',
  Ausgabe: 'Direkt von Bankkonto, PayPal oder Barkasse bezahlt.',
  Auslage: 'Jemand hat privat bezahlt. Zählt sofort als Ausgabe der GbR. Die Rückzahlung läuft später über den Tab „Auslagen".',
  Umbuchung: 'Geld wandert zwischen zwei eigenen Konten, z.B. PayPal → Bankkonto oder Barkasse → Bank. Kein Gewinn, kein Verlust.',
  Erstattung: 'Rückzahlung einer Auslage. Datum, Konto und Beschreibung lassen sich ändern. Betrag oder Person ändern: stornieren und im Tab „Auslagen" neu erstatten.',
};
function updateBookingForm(){
  const bf = document.getElementById('bf'); if(!bf) return;
  const art = ui.bf.art;
  bf.querySelectorAll('[data-show]').forEach(el=>{ el.style.display = el.dataset.show.split(' ').includes(art) ? '' : 'none'; });
  if(art==='Erstattung'){ const k = bf.querySelector('#bf-konto'); if(k) k.parentElement.style.display=''; }
  bf.querySelectorAll('#bf-art button').forEach(b=>b.classList.toggle('active', b.dataset.art===art));
  const kat = document.getElementById('bf-kat');
  if(kat){
    const cur = kat.value || kat.dataset.current;
    const list = art==='Einnahme' ? [...KAT_EINNAHME, '—', ...KAT_NEUTRAL_EIN] : [...KAT_AUSGABE, '—', ...(art==='Ausgabe'?KAT_NEUTRAL_AUS:[])];
    const opts = [`<option value="" ${!cur?'selected':''}>– Kategorie wählen –</option>`].concat(list.map(k=> k==='—' ? `<option disabled>── kein Gewinn/Verlust ──</option>` : `<option ${cur===k?'selected':''}>${esc(k)}</option>`));
    if(cur && !list.includes(cur) && !NEUTRAL.includes(cur)) opts.splice(1, 0, `<option selected>${esc(cur)}</option>`);
    kat.innerHTML = opts.join('');
  }
  const kl = document.getElementById('bf-konto-label'); if(kl) kl.textContent = art==='Einnahme' ? 'Eingang auf' : 'Bezahlt über';
  const h = document.getElementById('bf-hint'); if(h) h.textContent = BF_HINTS[art] || '';
}
async function saveBooking(){
  const editing = ui.bf.editingId ? byId(ui.bf.editingId) : null;
  const art = ui.bf.art;
  const datum = val('bf-datum') || today();
  const raw = val('bf-betrag');
  const betrag = round2(parseAmount(raw));
  const beschreibung = val('bf-beschreibung').trim();
  if(!(betrag > 0)){ showToast('Betrag fehlt oder ist ungültig (z.B. 12,50)'); return; }
  if(!beschreibung){ showToast('Bitte eine Beschreibung angeben'); return; }
  let row = { datum, betrag, beschreibung };
  if(art==='Einnahme' || art==='Ausgabe'){
    Object.assign(row, { typ:art, konto:val('bf-konto'), zielKonto:'', bezahltVon:'', kategorie:val('bf-kat'), projektId:val('bf-projekt') });
  } else if(art==='Auslage'){
    const person = val('bf-person');
    if(!person){ showToast('Wer hat privat bezahlt?'); return; }
    Object.assign(row, { typ:'Ausgabe', konto:'Privat', zielKonto:'', bezahltVon:person, kategorie:val('bf-kat'), projektId:val('bf-projekt') });
  } else if(art==='Umbuchung'){
    const von = val('bf-von'), nach = val('bf-nach');
    if(von===nach){ showToast('Von- und Nach-Konto sind gleich'); return; }
    Object.assign(row, { typ:'Umbuchung', konto:von, zielKonto:nach, bezahltVon:'', kategorie:'Umbuchung', projektId:'' });
  } else if(art==='Erstattung'){
    row = { datum, beschreibung, konto: val('bf-konto') };
    if(editing && Math.abs(betrag - editing.betrag) > 0.001){ showToast('Betrag einer Erstattung nicht ändern – stornieren und neu erstatten.', 4500); return; }
  }
  if(['Einnahme','Ausgabe','Auslage'].includes(art) && !row.kategorie){ showToast('Bitte eine Kategorie wählen'); return; }
  if(editing && isAuslage(editing) && !auslageOffen(editing)){
    const changed = Math.abs(editing.betrag - betrag) > 0.001 || row.konto!=='Privat' || row.bezahltVon!==editing.bezahltVon;
    if(changed){ showToast('Diese Auslage ist schon erstattet. Erst die Erstattung stornieren, dann Betrag/Person ändern.', 5000); return; }
  }
  const file = (document.getElementById('bf-beleg')||{}).files ? document.getElementById('bf-beleg').files[0] : null;
  const kuerzel = (state.projects[row.projektId ?? (editing&&editing.projektId)]||{}).kuerzel;
  await withBusy(file ? 'Lädt Beleg hoch…' : 'Speichert…', async ()=>{
    if(editing){
      const updated = Object.assign({}, editing, row, { pruefen:false, geaendertAm: nowStamp(), geaendertVon: me() });
      if(file) updated.belegUrl = await storeBeleg(file, updated, kuerzel);
      await updateRows('Journal', [updated]);
      await protokoll('geändert', updated.id, editing, updated);
      ui.bf.editingId = null;
    } else {
      // frische Belegnummer, falls parallel jemand gebucht hat
      state.journal = (await readSheet('Journal')).map(normJournal);
      const nr = nextBelegnummer();
      const neu = Object.assign({ id: uid(), belegnr: nr, erstattetDurch:'', bezugId:'', belegUrl:'', storniert:false, stornoGrund:'', pruefen:false, hinweis:'', erfasstAm: nowStamp(), erfasstVon: me(), geaendertAm:'', geaendertVon:'' }, row);
      if(file) neu.belegUrl = await storeBeleg(file, neu, kuerzel);
      await appendRows('Journal', [neu]);
      await protokoll('neu', neu.id, null, neu);
      showToast(`Gebucht als #${nr}`);
    }
    await refresh();
  });
  renderContent();
}

// ---------- Journal-Tabelle ----------
function journalTable(rows, opts){
  opts = opts || {};
  if(!rows.length) return `<div class="empty">${opts.empty || 'Keine Buchungen.'}</div>`;
  const body = rows.map(r=>{
    const art = artOf(r);
    const sign = r.typ==='Einnahme' ? 'pos' : (r.typ==='Ausgabe' ? 'neg' : '');
    const kontoTxt = r.typ==='Umbuchung' ? `${accLabel(r.konto)} → ${accLabel(r.zielKonto)}` : (r.konto==='Privat' ? `<span class="badge person">${esc(r.bezahltVon)}</span>` : accLabel(r.konto));
    let status = '';
    if(r.storniert) status += `<span class="badge red" title="${escAttr(r.stornoGrund)}">storniert</span> `;
    if(!r.storniert && r.pruefen) status += `<span class="badge warn" title="${escAttr(r.hinweis)}">prüfen</span> `;
    if(!r.storniert && isAuslage(r)) status += auslageOffen(r) ? `<span class="badge warn">offen</span> ` : `<span class="badge settled">erstattet</span> `;
    if(!r.storniert && isErstattung(r)) status += `<span class="badge grey">Erstattung</span> `;
    if(!r.storniert && !isEuer(r) && !isErstattung(r)) status += `<span class="badge grey">neutral</span> `;
    const beleg = r.belegUrl ? `<a class="link" href="${escAttr(r.belegUrl)}" target="_blank" rel="noopener">ansehen</a>` : (needsBeleg(r) ? '<span class="badge warn">fehlt</span>' : '—');
    const canEdit = !r.storniert;
    return `<tr class="${r.storniert?'storno':''} ${ui.bf.editingId===r.id?'editing':''}">
      <td class="nr">${esc(r.belegnr)}</td>
      <td class="date">${deDate(r.datum)}</td>
      <td class="desc">${esc(r.beschreibung)}<span class="small">${esc(art==='Umbuchung'?'Umbuchung':r.kategorie)}${!opts.hideProject && r.projektId?' · '+esc(projName(r.projektId)):''}${r.storniert&&r.stornoGrund?' · Storno: '+esc(r.stornoGrund):''}</span></td>
      <td>${kontoTxt}</td>
      <td class="num ${sign}">${r.typ==='Ausgabe'?'−':''}${eur(r.betrag)}</td>
      <td>${status}</td>
      <td>${beleg}</td>
      <td class="actions">${canEdit?`<button class="btn ghost small" data-action="edit" data-id="${r.id}">Bearbeiten</button> <button class="btn danger small" data-action="storno" data-id="${r.id}">Storno</button>`:''}</td>
    </tr>`;
  }).join('');
  return `<div class="tablewrap"><table><thead><tr><th>Nr.</th><th>Datum</th><th>Beschreibung</th><th>Konto</th><th class="num">Betrag</th><th>Status</th><th>Beleg</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;
}
function sortRows(rows, asc){
  return rows.slice().sort((a,b)=>{ const d = (a.datum||'').localeCompare(b.datum||''); if(d) return asc?d:-d; const n = (parseInt(a.belegnr)||0)-(parseInt(b.belegnr)||0); return asc?n:-n; });
}

function renderJournal(){
  const f = ui.filter;
  let rows = state.journal.filter(r=>inYear(r));
  if(!f.storno) rows = rows.filter(r=>!r.storniert);
  if(f.konto) rows = rows.filter(r=>r.konto===f.konto || r.zielKonto===f.konto);
  if(f.projekt) rows = rows.filter(r=> f.projekt==='-' ? !r.projektId : r.projektId===f.projekt);
  if(f.art) rows = rows.filter(r=>artOf(r)===f.art);
  if(f.ohneBeleg) rows = rows.filter(needsBeleg);
  if(f.pruefen) rows = rows.filter(r=>r.pruefen && !r.storniert);
  if(f.q){ const q = f.q.toLowerCase(); rows = rows.filter(r=>[r.beschreibung,r.kategorie,r.belegnr,r.bezahltVon,projName(r.projektId),amountInput(r.betrag)].join(' ').toLowerCase().includes(q)); }
  rows = sortRows(rows, false);
  const sumE = round2(rows.filter(r=>!r.storniert && r.typ==='Einnahme').reduce((s,r)=>s+r.betrag,0));
  const sumA = round2(rows.filter(r=>!r.storniert && r.typ==='Ausgabe').reduce((s,r)=>s+r.betrag,0));
  const sel = (id, opts, cur)=>`<select id="${id}" data-filter style="width:auto;">${opts.map(([v,l])=>`<option value="${escAttr(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  return `
    ${migrationCard()}
    ${bookingForm()}
    <div class="card">
      <div class="card-head"><h2>Alle Buchungen ${ui.year==='alle'?'':ui.year} · ${rows.length}</h2>
        <div class="hint" style="margin:0;">Zugänge ${eur(sumE)} · Abgänge ${eur(sumA)}</div></div>
      <div class="row-form" style="margin-top:0; margin-bottom:12px;">
        ${sel('f-konto', [['','alle Konten'], ...ACCOUNTS.map(a=>[a,accLabel(a)]), ['Privat','privat ausgelegt']], f.konto)}
        ${sel('f-projekt', [['','alle Projekte'],['-','allgemein'], ...state.projectOrder.map(id=>[id,state.projects[id].name])], f.projekt)}
        ${sel('f-art', [['','alle Arten'],['Einnahme','Einnahmen'],['Ausgabe','Ausgaben'],['Auslage','Auslagen'],['Erstattung','Erstattungen'],['Umbuchung','Umbuchungen']], f.art)}
        <input type="text" id="f-q" placeholder="Suchen…" value="${escAttr(f.q)}" style="width:170px;">
        <label class="check"><input type="checkbox" id="f-ohneBeleg" ${f.ohneBeleg?'checked':''}> ohne Beleg</label>
        <label class="check"><input type="checkbox" id="f-pruefen" ${f.pruefen?'checked':''}> zu prüfen</label>
        <label class="check"><input type="checkbox" id="f-storno" ${f.storno?'checked':''}> Stornos zeigen</label>
      </div>
      ${journalTable(rows, { empty:'Keine Buchungen für diese Auswahl.' })}
      <div class="hint">Buchungen werden nicht gelöscht, sondern storniert. So bleibt die Nummernfolge lückenlos und jede Änderung nachvollziehbar (Tab „Protokoll" im Sheet).</div>
    </div>`;
}

// ---------- Konten ----------
function renderKonten(){
  const k = ui.konto;
  const kr = kontoRow(k);
  const y = ui.year;
  const [from, to] = yearBounds(y);
  const J = kontoJahr(k, y);
  let rows = sortRows(active().filter(r=>(r.konto===k || r.zielKonto===k) && counts(r,k) && (!from || (r.datum>=from && r.datum<to))), true);
  let saldo = J.start;
  const ignored = active().filter(r=>(r.konto===k || r.zielKonto===k) && !counts(r,k)).length;
  const body = rows.map(r=>{
    const e = effect(r,k); saldo = round2(saldo + e);
    const gegen = r.typ==='Umbuchung' ? (r.konto===k ? `→ ${accLabel(r.zielKonto)}` : `← ${accLabel(r.konto)}`) : (isErstattung(r) ? `an ${esc(r.bezahltVon)}` : esc(r.kategorie));
    return `<tr><td class="nr">${esc(r.belegnr)}</td><td class="date">${deDate(r.datum)}</td>
      <td class="desc">${esc(r.beschreibung)}<span class="small">${gegen}${r.projektId?' · '+esc(projName(r.projektId)):''}</span></td>
      <td class="num pos">${e>0?eur(e):''}</td><td class="num neg">${e<0?eur(-e):''}</td><td class="num"><b>${eur(saldo)}</b></td>
      <td>${r.belegUrl?`<a class="link" href="${escAttr(r.belegUrl)}" target="_blank" rel="noopener">Beleg</a>`:''}</td></tr>`;
  }).join('');
  const abglBal = kr.tatsaechlichDatum ? balanceAt(k, nextDay(kr.tatsaechlichDatum)) : balanceAt(k, null);
  const diff = round2(kr.tatsaechlich - abglBal);
  const hasAbgl = kr.tatsaechlichDatum || kr.tatsaechlich;
  return `
    <div class="card">
      <div class="proj-list" style="margin-bottom:0;">${ACCOUNTS.map(a=>`<div class="proj-chip ${a===k?'active':''}" data-action="pick-konto" data-konto="${a}">${accLabel(a)} · ${eur(balanceAt(a,null))}</div>`).join('')}</div>
    </div>
    <div class="grid cols-4" style="margin-bottom:18px;">
      <div class="kpi"><div class="label">${from?'Stand 01.01.'+y:'Anfangsbestand'}</div><div class="value">${eur(J.start)}</div></div>
      <div class="kpi"><div class="label">Zugänge</div><div class="value pos">${eur(J.zu)}</div></div>
      <div class="kpi"><div class="label">Abgänge</div><div class="value neg">${eur(J.ab)}</div></div>
      <div class="kpi"><div class="label">${from && to<=today() ? 'Stand 31.12.'+y : 'Stand jetzt'}</div><div class="value ${J.ende>=0?'':'neg'}">${eur(J.ende)}</div></div>
    </div>
    <div class="card">
      <h2>Kontoauszug ${accLabel(k)} ${y==='alle'?'':y}</h2>
      ${ignored?`<div class="note">${ignored} Buchung${ignored>1?'en liegen':' liegt'} vor dem Startdatum ${deDate(kr.anfangDatum)} und ${ignored>1?'zählen':'zählt'} nicht in den Saldo.</div>`:''}
      ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>Nr.</th><th>Datum</th><th>Beschreibung</th><th class="num">Zugang</th><th class="num">Abgang</th><th class="num">Saldo</th><th></th></tr></thead>
        <tbody><tr class="sub"><td></td><td class="date">${from?deDate(from):(kr.anfangDatum?deDate(kr.anfangDatum):'')}</td><td>${from?'Übertrag':'Anfangsbestand'}</td><td></td><td></td><td class="num">${eur(J.start)}</td><td></td></tr>${body}
        <tr class="total"><td></td><td></td><td>Endstand</td><td class="num pos">${eur(J.zu)}</td><td class="num neg">${eur(J.ab)}</td><td class="num">${eur(J.ende)}</td><td></td></tr></tbody></table></div>`
        : `<div class="empty">Keine Bewegungen auf diesem Konto im gewählten Zeitraum.</div>`}

    <div class="card">
      <h2>Abgleich mit echtem Kontoauszug</h2>
      <div class="form-grid">
        <div class="field"><label>Anfangsbestand €</label><input type="text" inputmode="decimal" class="amount" id="k-anfang" value="${amountInput(kr.anfang)}"></div>
        <div class="field"><label>gilt ab (Startdatum)</label><input type="date" id="k-anfangDatum" value="${escAttr(kr.anfangDatum)}"></div>
        <div class="field"><label>Stand laut Kontoauszug €</label><input type="text" inputmode="decimal" class="amount" id="k-tat" value="${hasAbgl?amountInput(kr.tatsaechlich):''}"></div>
        <div class="field"><label>am</label><input type="date" id="k-tatDatum" value="${escAttr(kr.tatsaechlichDatum)}"></div>
        <button class="btn ghost" data-action="konto-save">Speichern</button>

        ${Math.abs(diff)<0.005 ? 'Stimmt überein.' : `Differenz <b>${eur(diff)}</b>. ${diff>0?'Auf dem Konto ist mehr Geld, als gebucht ist: Einnahme oder Umbuchung fehlt.':'Auf dem Konto ist weniger Geld, als gebucht ist: Ausgabe, Erstattung oder Gebühr fehlt.'}`}
      </div>` : `<div class="hint">Anfangsbestand = Kontostand am Startdatum, bevor die erste Buchung in der App erfasst ist. Den Stand vom letzten Kontoauszug eintragen, dann rechnet die App die Differenz aus.</div>`}
    </div>`;
}

function renderAuslagen(){
  const members = allMembersWithAuslagen();
  const rows = members.map(m=>{ const t = memberTotals(m); return t.gesamt ? `<tr><td>${esc(m)}</td><td class="num">${eur(t.gesamt)}</td><td class="num pos">${eur(t.erstattet)}</td><td class="num ${t.offen>0?'neg':''}">${eur(t.offen)}</td></tr>` : ''; }).join('');
  const totalOffen = round2(members.reduce((s,m)=>s+memberTotals(m).offen,0));
  const open = members.map(m=>{
    const t = memberTotals(m);
    if(!t.offenList.length) return '';
    const list = sortRows(t.offenList, true).map(a=>`<tr><td class="checkbox-cell"><input type="checkbox" data-erst-m="${escAttr(m)}" value="${a.id}" checked></td><td class="nr">${esc(a.belegnr)}</td><td class="date">${deDate(a.datum)}</td><td class="desc">${esc(a.beschreibung)}<span class="small">${esc(a.kategorie)}${a.projektId?' · '+esc(projName(a.projektId)):''}</span></td><td class="num">${eur(a.betrag)}</td></tr>`).join('');
    return `<div class="card" data-member-card="${escAttr(m)}">
      <div class="card-head"><h2>${esc(m)} · offen ${eur(t.offen)}</h2></div>
      <div class="tablewrap"><table><tbody>${list}</tbody></table></div>
      <div class="row-form">
        <div class="field"><label>Erstattet am</label><input type="date" data-erst-datum value="${today()}"></div>
        <div class="field"><label>über</label><select data-erst-konto>${ACCOUNTS.map(a=>`<option value="${a}">${accLabel(a)}</option>`).join('')}</select></div>
        <button class="btn" data-action="erstatten" data-member="${escAttr(m)}">Ausgewählte erstatten</button>
      </div>
    </div>`;
  }).join('');
  const erst = sortRows(state.journal.filter(r=>isErstattung(r) && inYear(r)), false);
  return `
    <div class="card">
      <h2>Auslagen der Mitglieder</h2>
      ${rows ? `<div class="tablewrap"><table><thead><tr><th>Mitglied</th><th class="num">Ausgelegt</th><th class="num">Erstattet</th><th class="num">Offen</th></tr></thead>

      <div class="hint">Eine Auslage zählt am Tag der privaten Zahlung als Ausgabe der GbR. Die Rückzahlung bucht nur Geld vom Konto an die Person und zählt nicht nochmal als Ausgabe.</div>
    </div>
    ${open}
    <div class="card">
      <h2>Erstattungen ${ui.year==='alle'?'':ui.year}</h2>
      ${journalTable(erst, { empty:'Keine Erstattungen in diesem Jahr.' })}
    </div>`;
}

function csvCell(v){ const s = (v??'').toString(); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }
function csvNum(n){ return (+n||0).toFixed(2).replace('.', ','); }
function download(filename, text){
  const blob = new Blob(['﻿'+text], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJournalCsv(){
  const y = ui.year;
  const head = ['Belegnr','Datum','Art','Kategorie','EÜR-wirksam','Konto','Zielkonto','Bezahlt von (privat)','Projekt','Beschreibung','Einnahme','Ausgabe','Umbuchung','Beleg','Storniert','Stornogrund','Erfasst am','Erfasst von','Geändert am','Geändert von','ID','Bezug'];
  const lines = [head.join(';')];
  sortRows(state.journal.filter(r=>inYear(r,y)), true).forEach(r=>{
    lines.push([r.belegnr, deDate(r.datum), artOf(r), r.typ==='Umbuchung'?'Umbuchung':r.kategorie, (!r.storniert&&isEuer(r))?'ja':'nein',
      accLabel(r.konto), r.zielKonto?accLabel(r.zielKonto):'', r.bezahltVon, projName(r.projektId), r.beschreibung,
      r.typ==='Einnahme'?csvNum(r.betrag):'', r.typ==='Ausgabe'?csvNum(r.betrag):'', r.typ==='Umbuchung'?csvNum(r.betrag):'',
      r.belegUrl, r.storniert?'ja':'', r.stornoGrund, r.erfasstAm, r.erfasstVon, r.geaendertAm, r.geaendertVon, r.id, r.bezugId].map(csvCell).join(';'));
  });
  download(`STUDIO_KARAT_Journal_${y}.csv`, lines.join('\r\n'));
}
function exportEuerCsv(){
  const y = ui.year; const E = euer(y);
  const lines = ['Bereich;Kategorie;Betrag'];
  Object.entries(E.ein).forEach(([k,v])=>lines.push(['Betriebseinnahmen',k,csvNum(v)].map(csvCell).join(';')));
  lines.push(['Betriebseinnahmen','Summe',csvNum(E.sumE)].join(';'));
  Object.entries(E.aus).forEach(([k,v])=>lines.push(['Betriebsausgaben',k,csvNum(v)].map(csvCell).join(';')));
  lines.push(['Betriebsausgaben','Summe',csvNum(E.sumA)].join(';'));
  lines.push(['Ergebnis',E.ergebnis>=0?'Überschuss':'Verlust',csvNum(E.ergebnis)].join(';'));
  download(`STUDIO_KARAT_EUER_${y}.csv`, lines.join('\r\n'));
}

// ============ Migration der Altdaten ============
const OLD_KAT = { 'Verbrauch':'Material & Verbrauch', 'Kauf':'Material & Verbrauch', 'Leihe':'Leihe & Miete Equipment', 'Anschaffung':'Technik & Geräte (bis 800 € netto)', 'Geschenk':'Geschenke (bis 50 €)' };
function mapVkKategorie(kat, typ){
  const k = (kat||'').toLowerCase();
  if(/umbuch|transfer|wechselgeld|restbudget|übertrag|uebertrag/.test(k)) return { kategorie: typ==='Einnahme'?'Sonstige Einnahmen':'Sonstige Ausgaben', pruefen:true, hinweis:`alte Kategorie „${kat}" – evtl. Umbuchung zwischen eigenen Konten` };
  if(/miet/.test(k)) return { kategorie: typ==='Einnahme'?'Mietanteile & Raumnutzung':'Miete & Nebenkosten', pruefen:false, hinweis:'' };
  if(/förder|foerder|zuschuss/.test(k) && typ==='Einnahme') return { kategorie:'Fördermittel & Zuschüsse', pruefen:false, hinweis:'' };
  if(/eintritt|ticket/.test(k) && typ==='Einnahme') return { kategorie:'Eintritte & Tickets', pruefen:false, hinweis:'' };
  if(/spende/.test(k) && typ==='Einnahme') return { kategorie:'Spenden', pruefen:false, hinweis:'' };
  if(/gebühr|gebuehr|versicher|beitrag/.test(k) && typ==='Ausgabe') return { kategorie:'Gebühren, Versicherung & Beiträge', pruefen:false, hinweis:'' };
  return { kategorie: typ==='Einnahme'?'Sonstige Einnahmen':'Sonstige Ausgaben', pruefen:true, hinweis: kat?`alte Kategorie „${kat}" – passende Kategorie wählen`:'Kategorie wählen' };
}
function buildMigration(){
  const L = state.legacy;
  const stamp = nowStamp(), who = me();
  const base = { zielKonto:'', bezahltVon:'', erstattetDurch:'', bezugId:'', belegUrl:'', storniert:false, stornoGrund:'', pruefen:false, hinweis:'', erfasstAm:stamp, erfasstVon:who+' (Übernahme)', geaendertAm:'', geaendertVon:'' };
  const out = [];
  const byOld = {};
  const usedNr = new Set();
  let maxNr = 0;
  [...L.buchungen, ...L.vk].forEach(r=>{ const n = parseInt(r.belegnr,10); if(!isNaN(n)) maxNr = Math.max(maxNr, n); });
  const takeNr = (nr)=>{ let s = nr!==''&&nr!==undefined ? String(nr) : ''; if(/^\d+$/.test(s)) s = s.padStart(4,'0'); if(!s || usedNr.has(s)){ maxNr++; s = String(maxNr).padStart(4,'0'); } usedNr.add(s); return s; };
  const addHint = (row, h)=>{ row.pruefen = true; row.hinweis = row.hinweis ? row.hinweis+'; '+h : h; };

  L.buchungen.forEach(b=>{
    const row = Object.assign({}, base, { id: String(b.id||uid()), belegnr: takeNr(b.belegnr), datum: toISO(b.datum), typ:'Ausgabe', betrag: round2(num(b.preis)),
      projektId: String(b.projektId||''), beschreibung: String(b.ausgabe||''), belegUrl: String(b.belegUrl||'') });
    const oldKat = String(b.kategorie||'');
    row.kategorie = OLD_KAT[oldKat] || oldKat || 'Sonstige Ausgaben';
    if(!OLD_KAT[oldKat]) addHint(row, oldKat?`alte Kategorie „${oldKat}"`:'Kategorie fehlt');
    if(oldKat==='Anschaffung') addHint(row, 'Anschaffung: über 800 € netto? Dann AfA');
    if(b.bezahltVon==='ausgeglichen' || !b.bezahltVon){
      row.konto = String(b.zahlweg||'');
      if(!ACCOUNTS.includes(row.konto)){ row.konto = 'Vereinskonto'; addHint(row, 'Zahlweg fehlte – Konto prüfen'); }
    } else {
      row.konto = 'Privat'; row.bezahltVon = String(b.bezahltVon);
    }
    if(!row.datum){ row.datum = today(); addHint(row, 'Datum fehlte'); }
    byOld[row.id] = row; out.push(row);
  });
  L.vk.forEach(v=>{
    const typ = v.typ==='Einnahme' ? 'Einnahme' : 'Ausgabe';
    const konto = ACCOUNTS.includes(String(v.konto)) ? String(v.konto) : 'Vereinskonto';
    const row = Object.assign({}, base, { id: String(v.id||uid()), belegnr: takeNr(v.belegnr), datum: toISO(v.datum), typ, betrag: round2(num(v.betrag)), konto,
      beschreibung: String(v.beschreibung||''), belegUrl: String(v.belegUrl||''), projektId:'' });
    if(v.quelleBuchungId && byOld[String(v.quelleBuchungId)]){
      const src = byOld[String(v.quelleBuchungId)];
      Object.assign(row, { typ:'Ausgabe', kategorie:'Erstattung Auslage', bezugId: src.id, bezahltVon: src.bezahltVon, projektId: src.projektId });
      src.erstattetDurch = row.id;
    } else {
      const m = mapVkKategorie(String(v.kategorie||''), typ);
      row.kategorie = m.kategorie; if(m.pruefen) addHint(row, m.hinweis);
    }
    if(!row.datum){ row.datum = today(); addHint(row, 'Datum fehlte'); }
    out.push(row);
  });
  // Erstattungen aus ganz alten Versionen ohne verknüpfte Kontobewegung
  L.buchungen.forEach(b=>{
    const src = byOld[String(b.id)];
    if(src && src.konto==='Privat' && truthy(b.erstattet) && !src.erstattetDurch){
      const via = ACCOUNTS.includes(String(b.erstattetVia)) ? String(b.erstattetVia) : 'Vereinskonto';
      const row = Object.assign({}, base, { id: uid(), belegnr: takeNr(''), datum: src.datum, typ:'Ausgabe', betrag: src.betrag, konto: via, kategorie:'Erstattung Auslage', bezugId: src.id, bezahltVon: src.bezahltVon, projektId: src.projektId, beschreibung:`Erstattung an ${src.bezahltVon}: ${src.beschreibung}` });
      addHint(row, 'Erstattungsdatum unbekannt – Datum laut Kontoauszug eintragen');
      src.erstattetDurch = row.id; out.push(row);
    }
  });
  // Projekt-Einnahmen (bisher nur Summenfelder ohne Datum)
  Object.values(state.projects).forEach(p=>{
    const dates = out.filter(r=>r.projektId===p.id && r.datum).map(r=>r.datum).sort();
    const d = dates[0] || today();
    [['einnahmenBar','Barkasse','bar'],['einnahmenShop','PayPal','PayPal']].forEach(([f,konto,label])=>{
      const b = round2(num(p[f]));
      if(!b) return;
      const row = Object.assign({}, base, { id: uid(), belegnr: takeNr(''), datum: d, typ:'Einnahme', betrag:b, konto, kategorie:'Eintritte & Tickets', projektId:p.id, beschreibung:`Einnahmen ${label} ${p.name} (Summe aus altem Projektfeld)` });
      addHint(row, 'war nur eine Summe: Datum, Kategorie prüfen, ggf. in Einzelbuchungen aufteilen');
      out.push(row);
    });
  });
  return out;
}
async function runMigration(){
  const rows = buildMigration();
  modal(`<h2>Altdaten übernehmen</h2><p>${rows.length} Buchungen werden ins Journal geschrieben, ${rows.filter(r=>r.pruefen).length} davon mit „prüfen" markiert. Die alten Tabs bleiben unverändert.</p>`, async ()=>{
    await withBusy('Übernimmt Altdaten…', async ()=>{
      state.journal = (await readSheet('Journal')).map(normJournal);
      if(state.journal.length) throw new Error('Im Journal stehen schon Buchungen – Übernahme abgebrochen.');
      await appendRows('Journal', rows);
      await protokoll('Übernahme Altdaten', '', null, { anzahl: rows.length });
      await refresh();
    });
    showToast(`${rows.length} Buchungen übernommen`);
    renderContent();
  }, 'Übernehmen');
}

// ============ Aktionen ============
async function stornoDialog(id){
  const r = byId(id); if(!r) return;
  if(isAuslage(r) && !auslageOffen(r)){ showToast('Diese Auslage ist schon erstattet. Zuerst die Erstattung stornieren.', 4500); return; }
  modal(`<h2>Buchung #${esc(r.belegnr)} stornieren</h2>
    <p>${esc(r.beschreibung)} · ${eur(r.betrag)}<br>Die Buchung bleibt sichtbar (durchgestrichen), zählt aber nicht mehr. Der Beleg bleibt in Drive.</p>
    <div class="field"><label>Grund *</label><input type="text" id="m-grund" placeholder="z.B. doppelt erfasst, falscher Betrag"></div>`, async ()=>{
    const grund = val('m-grund').trim();
    if(!grund){ showToast('Bitte einen Grund angeben'); return false; }
    await withBusy('Storniert…', async ()=>{
      const upd = [Object.assign({}, r, { storniert:true, stornoGrund:grund, geaendertAm:nowStamp(), geaendertVon:me() })];
      if(isErstattung(r)){
        r.bezugId.split(',').map(s=>s.trim()).filter(Boolean).forEach(aid=>{ const a = byId(aid); if(a && a.erstattetDurch===r.id) upd.push(Object.assign({}, a, { erstattetDurch:'', geaendertAm:nowStamp(), geaendertVon:me() })); });
      }
      await updateRows('Journal', upd);
      await protokoll('storniert', r.id, r, upd[0]);
      if(ui.bf.editingId===r.id) ui.bf.editingId = null;
      await refresh();
    });
    renderContent();
  }, 'Stornieren', true);
}
async function erstatten(member, btn){
  const card = btn.closest('[data-member-card]');
  const ids = [...card.querySelectorAll('input[data-erst-m]:checked')].map(i=>i.value);
  if(!ids.length){ showToast('Nichts ausgewählt'); return; }
  const datum = card.querySelector('[data-erst-datum]').value || today();
  const konto = card.querySelector('[data-erst-konto]').value;
  const items = ids.map(byId).filter(Boolean);
  const sum = round2(items.reduce((s,a)=>s+a.betrag,0));
  const projekte = [...new Set(items.map(a=>a.projektId))];
  await withBusy('Speichert…', async ()=>{
    state.journal = (await readSheet('Journal')).map(normJournal);
    const fresh = ids.map(byId).filter(a=>a && auslageOffen(a) && !a.storniert);
    if(fresh.length !== ids.length) throw new Error('Inzwischen hat jemand etwas geändert – bitte neu laden.');
    const nr = nextBelegnummer();
    const er = { id:uid(), belegnr:nr, datum, typ:'Ausgabe', betrag:sum, konto, zielKonto:'', kategorie:'Erstattung Auslage', projektId: projekte.length===1?projekte[0]:'',
      beschreibung:`Erstattung an ${member}: ${fresh.map(a=>'#'+a.belegnr).join(', ')}`, bezahltVon:member, erstattetDurch:'', bezugId: ids.join(','), belegUrl:'', storniert:false, stornoGrund:'', pruefen:false, hinweis:'', erfasstAm:nowStamp(), erfasstVon:me(), geaendertAm:'', geaendertVon:'' };
    await appendRows('Journal', [er]);
    await updateRows('Journal', fresh.map(a=>Object.assign({}, a, { erstattetDurch: er.id, geaendertAm:nowStamp(), geaendertVon:me() })));
    await protokoll('Erstattung', er.id, null, er);
    await refresh();
  });
  showToast(`${eur(sum)} an ${member} erstattet`);
  renderContent();
}

function afterRender(){
  updateBookingForm();
  document.querySelectorAll('#bf-art button').forEach(b=>b.onclick=()=>{ ui.bf.art = b.dataset.art; updateBookingForm(); });
  // Filter
  [['f-konto','konto'],['f-projekt','projekt'],['f-art','art']].forEach(([id,k])=>{ const el=document.getElementById(id); if(el) el.onchange=()=>{ ui.filter[k]=el.value; renderContent(); }; });
  ['ohneBeleg','pruefen','storno'].forEach(k=>{ const el=document.getElementById('f-'+k); if(el) el.onchange=()=>{ ui.filter[k]=el.checked; renderContent(); }; });
  const q = document.getElementById('f-q');
  if(q) q.oninput = ()=>{ ui.filter.q = q.value; clearTimeout(afterRender._q); afterRender._q = setTimeout(()=>{ renderContent(); const n=document.getElementById('f-q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }, 250); };
  const amt = document.getElementById('bf-betrag');
  if(amt) amt.onblur = ()=>{ if(amt.value.trim()) amt.value = amountInput(round2(parseAmount(amt.value))); };
}

document.addEventListener('click', async (ev)=>{
  const el = ev.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  if(el.tagName==='A') ev.preventDefault();
  try {
    if(a==='settings') renderSetupForm();
    else if(a==='signout') signOut();
    else if(a==='goto-tab') switchTab(el.dataset.tab);
    else if(a==='goto-konto'){ ui.konto = el.dataset.konto; switchTab('konten'); }
    else if(a==='goto-journal-problems'){ ui.filter = { konto:'', projekt:'', art:'', q:'', ohneBeleg:false, pruefen:false, storno:false }; const pr = state.journal.some(r=>!r.storniert && r.pruefen && inYear(r)); if(pr) ui.filter.pruefen = true; else ui.filter.ohneBeleg = true; switchTab('journal'); }
    else if(a==='migrate') await runMigration();
    else if(a==='bf-save') await saveBooking();
    else if(a==='bf-cancel'){ ui.bf.editingId = null; ui.bf.art='Ausgabe'; renderContent(); }
    else if(a==='edit'){ ui.bf.editingId = el.dataset.id; renderContent(); const f=document.getElementById('bf'); if(f) f.scrollIntoView({behavior:'smooth', block:'start'}); }
    else if(a==='storno') await stornoDialog(el.dataset.id);
    else if(a==='pick-project'){ ui.projectId = el.dataset.pid; ui.bf.editingId = null; renderContent(); }
    else if(a==='pick-konto'){ ui.konto = el.dataset.konto; renderContent(); }
    else if(a==='erstatten') await erstatten(el.dataset.member, el);
    else if(a==='csv') exportJournalCsv();
    else if(a==='csv-euer') exportEuerCsv();
    else if(a==='print') window.print();
    else if(a==='project-add'){
      const name = val('new-proj-name').trim(), kuerzel = val('new-proj-kuerzel').trim().toUpperCase(), traeger = val('new-proj-traeger').trim();
      if(!name || !kuerzel || !traeger){ showToast('Titel, Kürzel und Projektträger sind Pflichtfelder'); return; }
      const p = { id:uid(), name, kuerzel, traeger, budget: round2(parseAmount(val('new-proj-budget'))), einnahmenBar:0, einnahmenShop:0 };
      await withBusy('Speichert…', async ()=>{ await appendRows('Projekte', [p]); await protokoll('Projekt neu', p.id, null, p); await refresh(); });
      ui.projectId = p.id; renderContent();
    }
    else if(a==='project-save'){
      const p = state.projects[ui.projectId];
      const upd = Object.assign({}, p, { name: val('p-name').trim()||p.name, kuerzel: val('p-kuerzel').trim().toUpperCase()||'ALLG', traeger: val('p-traeger').trim(), budget: round2(parseAmount(val('p-budget'))) });
      await withBusy('Speichert…', async ()=>{ await updateRows('Projekte', [upd]); await protokoll('Projekt geändert', p.id, p, upd); await refresh(); });
      renderContent(); showToast('Gespeichert');
    }
    else if(a==='project-delete'){
      const p = state.projects[ui.projectId];
      const n = state.journal.filter(r=>r.projektId===p.id).length;
      if(n){ showToast(`Das Projekt hat ${n} Buchung(en) und kann nicht gelöscht werden. Buchungen bleiben für die Steuer erhalten.`, 5000); return; }
      modal(`<h2>Projekt löschen?</h2><p>„${esc(p.name)}" hat keine Buchungen und wird entfernt.</p>`, async ()=>{
        await withBusy('Löscht…', async ()=>{ await deleteRowById('Projekte', p.id); await protokoll('Projekt gelöscht', p.id, p, null); await refresh(); });
        ui.projectId = null; renderContent();
      }, 'Löschen', true);
    }
    else if(a==='konto-save'){
      const k = ui.konto, old = kontoRow(k);
      const row = { konto:k, anfang: round2(parseAmount(val('k-anfang'))), anfangDatum: val('k-anfangDatum'), tatsaechlich: round2(parseAmount(val('k-tat'))), tatsaechlichDatum: val('k-tatDatum') };
      await withBusy('Speichert…', async ()=>{
        if(state.konten.some(x=>x.konto===k)) await updateRows('Konten', [row], 'konto'); else await appendRows('Konten', [row]);
        await protokoll('Konto geändert', k, old, row);
        await refresh();
      });
      renderContent(); showToast('Gespeichert');
    }
  } catch(err){ console.error(err); }
});

// ============ Setup- / Sign-in-Screens ============
function renderSetupForm(){
  const cfg = CONFIG || {};
  const canGoBack = !!(CONFIG && accessToken);
  const st = state.stamm || {};
  const memberRows = canGoBack ? state.members.map((m,i)=>`
      <div class="member-edit">
        <input type="text" data-member-idx="${i}" value="${escAttr(m)}">
        <button class="btn danger small" data-del-member="${i}">×</button>
      </div>`).join('') : '';
  document.getElementById('page').innerHTML = `
    <div class="setup-card">
      <h2>Einstellungen</h2>
      <p>Verbindungsdaten werden nur lokal in diesem Browser gespeichert, nicht irgendwo hochgeladen.</p>
      <div class="field"><label>OAuth Client-ID (aus Google Cloud Console)</label><input type="text" id="cfg-client" value="${escAttr(cfg.clientId||'')}" placeholder="123456789-abc...apps.googleusercontent.com"></div>
      <div class="field"><label>Google Sheet ID (aus der Sheets-URL)</label><input type="text" id="cfg-sheet" value="${escAttr(cfg.spreadsheetId||'')}" placeholder="1AbCdEfGhIjKlMnOpQrStUvWxYz..."></div>
      <div class="field"><label>Finanzen-Ordner-ID in Drive (für Belege)</label><input type="text" id="cfg-folder" value="${escAttr(cfg.financeFolderId||'')}" placeholder="1XyZ... (aus der Drive-Ordner-URL)"></div>
      <div class="row-form">
        <button class="btn" id="cfg-save">Speichern & verbinden</button>
        ${canGoBack ? '<button class="btn ghost" id="cfg-back">Zurück, ohne zu speichern</button>' : ''}
      </div>
      ${canGoBack ? `
        <h3 style="margin-top:26px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary);">Stammdaten für den Jahresabschluss</h3>
        <div class="field"><label>Name</label><input type="text" id="st-name" value="${escAttr(st.name||'')}"></div>
        <div class="field"><label>Anschrift</label><input type="text" id="st-anschrift" value="${escAttr(st.anschrift||'')}"></div>
        <div class="field"><label>Steuernummer</label><input type="text" id="st-steuernummer" value="${escAttr(st.steuernummer||'')}"></div>
        <div class="field"><label>Gesellschafter (mit Komma getrennt)</label><input type="text" id="st-gesellschafter" value="${escAttr(st.gesellschafter||'')}"></div>
        <div class="field"><label>Umsatzsteuer-Status</label><input type="text" id="st-umsatzsteuer" value="${escAttr(st.umsatzsteuer||'')}" placeholder="z.B. Kleinunternehmer nach § 19 UStG"></div>
        <div class="row-form"><button class="btn ghost" id="save-stamm">Stammdaten speichern</button></div>

        <h3 style="margin-top:26px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-secondary);">Mitglieder</h3>
        <div class="hint">Namen anpassen. Bereits gebuchte Einträge behalten den alten Namen als Text.</div>
        ${memberRows}
        <div class="row-form">
          <div class="field" style="margin-bottom:0;"><label>Neues Mitglied</label><input type="text" id="new-member-name" style="min-width:180px;"></div>
          <button class="btn ghost" id="add-member">+ Hinzufügen</button>
        </div>
        <div class="row-form"><button class="btn ghost" id="save-members">Namen speichern</button></div>
      ` : ''}
    </div>`;
  document.getElementById('cfg-save').onclick = ()=>{
    const clientId = val('cfg-client').trim();
    const spreadsheetId = val('cfg-sheet').trim();
    const financeFolderId = val('cfg-folder').trim();
    if(!clientId || !spreadsheetId){ showToast('Bitte Client-ID und Sheet-ID ausfüllen'); return; }
    const changed = !CONFIG || CONFIG.clientId !== clientId;
    CONFIG = { clientId, spreadsheetId, financeFolderId };
    try { localStorage.setItem('karat_config', JSON.stringify(CONFIG)); } catch(e){}
    if(changed || !tokenClient) initGis();
    if(accessToken){ boot(); } else { renderSetupOrSignIn(); }
  };
  const backBtn = document.getElementById('cfg-back');
  if(backBtn) backBtn.onclick = ()=> renderApp();
  if(canGoBack){
    document.getElementById('save-stamm').onclick = async ()=>{
      const keys = ['name','anschrift','steuernummer','gesellschafter','umsatzsteuer'];
      const rows = keys.map(k=>[k, val('st-'+k).trim()]);
      Object.keys(state.stamm).filter(k=>!keys.includes(k)).forEach(k=>rows.push([k, state.stamm[k]]));
      await withBusy('Speichert…', async ()=>{ await clearAndWrite('Stammdaten', rows); await refresh(); });
      showToast('Gespeichert');
    };
    document.getElementById('add-member').onclick = async ()=>{
      const v = val('new-member-name').trim(); if(!v) return;
      await withBusy('Speichert…', async ()=>{ await clearAndWrite('Mitglieder', [...state.members, v].map(n=>[n])); await refresh(); });
      renderSetupForm();
    };
    document.querySelectorAll('[data-del-member]').forEach(el=>el.onclick=async()=>{
      const names = state.members.filter((_,i)=>i!==+el.dataset.delMember);
      await withBusy('Speichert…', async ()=>{ await clearAndWrite('Mitglieder', names.map(n=>[n])); await refresh(); });
      renderSetupForm();
    });
    document.getElementById('save-members').onclick = async ()=>{
      const names = state.members.map((_,i)=>document.querySelector(`[data-member-idx="${i}"]`).value.trim()).filter(Boolean);
      await withBusy('Speichert…', async ()=>{ await clearAndWrite('Mitglieder', names.map(n=>[n])); await refresh(); });
      renderSetupForm(); showToast('Gespeichert');
    };
  }
}

function renderSignIn(){
  document.getElementById('page').innerHTML = `
    <div class="setup-card">
      <h2>Anmelden</h2>
      <p>Meldet dich mit deinem Google-Konto an, damit die App auf das gemeinsame Sheet zugreifen kann.</p>
      <button class="gsi-btn" id="signin-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 3-2.2 5.5-4.6 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-17.4z"/><path fill="#FBBC05" d="M10.5 19.3c-.5 1.4-.8 3-.8 4.7s.3 3.3.8 4.7l-7.9 6.1C1 31.4 0 27.8 0 24s1-7.4 2.6-10.8l7.9 6.1z"/><path fill="#34A853" d="M24 48c6.4 0 11.8-2.1 15.7-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.3 2.2-6.3 0-11.6-3.5-13.5-9.6l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Mit Google anmelden
      </button>
      <p style="margin-top:14px;"><a href="#" id="reset-config" style="color:var(--text-tertiary); font-size:12px;">Einrichtung zurücksetzen</a></p>
    </div>`;
  document.getElementById('signin-btn').onclick = ()=> signIn(false);
  document.getElementById('reset-config').onclick = (e)=>{ e.preventDefault(); try{ localStorage.removeItem('karat_config'); }catch(_){} CONFIG=null; renderSetupOrSignIn(); };
}

function renderSetupOrSignIn(){
  if(!CONFIG){ renderSetupForm(); return; }
  if(!tokenClient){
    if(!(window.google && google.accounts && google.accounts.oauth2)){ setTimeout(renderSetupOrSignIn, 150); return; }
    initGis();
  }
  if(!accessToken){ renderSignIn(); return; }
  renderApp();
}

async function boot(){
  document.getElementById('page').innerHTML = '<div class="loading">Lade Daten…</div>';
  try{
    await ensureSheets();
    await refresh();
    renderApp();
  } catch(err){
    console.error(err);
    document.getElementById('page').innerHTML = `<div class="setup-card"><h2>Fehler beim Laden</h2><p>${esc(err.message||err)}</p><button class="btn" onclick="location.reload()">Neu laden</button></div>`;
  }
}

renderSetupOrSignIn();
</script>
